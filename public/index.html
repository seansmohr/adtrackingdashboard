<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mohr Insurance — Ad Performance Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="header-content">
      <h1>Mohr Insurance &mdash; Ad Performance Dashboard</h1>
      <div class="header-right">
        <span id="last-refreshed" class="refresh-time"></span>
        <button id="btn-refresh" class="btn btn-refresh" title="Refresh data">&#x21bb; Refresh</button>
      </div>
    </div>
  </header>

  <main>
    <div id="error-banner" class="error-banner hidden">
      <span id="error-message"></span>
      <button id="btn-error-retry" class="btn btn-small">Retry</button>
      <button id="btn-error-dismiss" class="btn btn-small btn-dismiss">&times;</button>
    </div>

    <section class="date-controls">
      <div class="date-toggles">
        <button class="btn btn-toggle" data-range="today">Today</button>
        <button class="btn btn-toggle active" data-range="7">Last 7 Days</button>
        <button class="btn btn-toggle" data-range="30">Last 30 Days</button>
        <button class="btn btn-toggle" data-range="custom">Custom</button>
      </div>
      <div id="custom-range" class="custom-range hidden">
        <input type="date" id="start-date">
        <span>to</span>
        <input type="date" id="end-date">
        <button id="btn-apply-range" class="btn btn-primary">Apply</button>
      </div>
    </section>

    <section class="metrics-row" id="metrics">
      <div class="metric-card">
        <div class="metric-label">Total Leads</div>
        <div class="metric-value" id="total-leads">—</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Total Appts</div>
        <div class="metric-value" id="total-appts">—</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">Active Ads</div>
        <div class="metric-value" id="active-ads">—</div>
      </div>
    </section>

    <section class="table-section">
      <h2>Performance by Ad</h2>
      <div id="loading" class="loading hidden">Loading data...</div>
      <div id="empty-state" class="empty-state hidden">No leads found for this date range.</div>
      <div class="table-wrapper">
        <table id="performance-table" class="hidden">
          <thead>
            <tr>
              <th data-sort="ad_name" class="sortable">Ad Name</th>
              <th data-sort="lead_count" class="sortable sort-active sort-desc">Leads</th>
              <th data-sort="appt_count" class="sortable">Appts</th>
            </tr>
          </thead>
          <tbody id="table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
